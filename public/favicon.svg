<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Background -->
  <rect width="100" height="100" fill="#0f172a" rx="20"/>
  
  <!-- Shield icon with gradient -->
  <defs>
    <linearGradient id="shieldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Shield shape -->
  <path d="M 50 15 L 75 30 L 75 50 Q 75 75 50 85 Q 25 75 25 50 L 25 30 Z" fill="url(#shieldGradient)" stroke="#60a5fa" stroke-width="2"/>
  
  <!-- Checkmark in center -->
  <path d="M 38 50 L 45 58 L 62 40" stroke="#ffffff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
